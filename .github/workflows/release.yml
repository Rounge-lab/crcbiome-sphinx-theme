name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0, without v)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Releases may only be dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched from main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine packaging

      - name: Assert version matches source and tag is new
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          requested = os.environ["RELEASE_VERSION"]
          Version(requested)  # Reject invalid version strings.

          with Path("pyproject.toml").open("rb") as file:
              source = tomllib.load(file)["project"]["version"]

          if requested != source:
              raise SystemExit(
                  f"Requested version {requested!r} does not match "
                  f"pyproject.toml version {source!r}"
              )
          PY

          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

      # Add test or documentation-build steps here if available.

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create GitHub release
        run: |
          gh release create "v${RELEASE_VERSION}" dist/* \
            --target "$GITHUB_SHA" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
